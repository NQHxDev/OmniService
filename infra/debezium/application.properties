# 1. Source Connector (PostgreSQL Logical Decoding via pgoutput)
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.plugin.name=pgoutput
debezium.source.database.hostname=${POSTGRES_HOST:auth-postgres}
debezium.source.database.port=${POSTGRES_PORT:5433}
debezium.source.database.user=${POSTGRES_USER:postgres}
debezium.source.database.password=${POSTGRES_PASSWORD:postgres}
debezium.source.database.dbname=${POSTGRES_DB:omni_service_auth}
debezium.source.database.server.name=omni_auth_cdc
debezium.source.publication.name=outbox_pub
debezium.source.slot.name=debezium_auth_outbox_slot
debezium.source.table.include.list=public.outbox_events
debezium.source.tombstones.on.delete=false
debezium.source.slot.drop.on.stop=false

# Offset & Schema History Storage (File-based for standalone Debezium Server)
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000

# 2. Sink Configuration (RabbitMQ AMQP 0-9-1)
debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=${RABBITMQ_HOST:rabbitmq}
debezium.sink.rabbitmq.connection.port=${RABBITMQ_PORT:5672}
debezium.sink.rabbitmq.connection.username=${RABBITMQ_USER:guest}
debezium.sink.rabbitmq.connection.password=${RABBITMQ_PASS:guest}
debezium.sink.rabbitmq.connection.virtualHost=/
debezium.sink.rabbitmq.exchange=omni.events
debezium.sink.rabbitmq.routingKey=outbox

# 3. Single Message Transformations (SMT): Debezium Outbox Event Router
# Unwraps the Outbox CDC row and emits pure payload directly to the routed exchange/topic
debezium.transforms=outbox
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.table.fields.additional.placement=aggregate_type:header:aggregateType,event_type:header:eventType
debezium.transforms.outbox.route.by.field=aggregate_type
debezium.transforms.outbox.route.topic.replacement=omni.${routedByValue}.events

# Heartbeat & Liveness (Prevents WAL retention slot bloat during low traffic periods)
debezium.source.heartbeat.interval.ms=10000
debezium.source.heartbeat.topics.prefix=omni.cdc.heartbeat
