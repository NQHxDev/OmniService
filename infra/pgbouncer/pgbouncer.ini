[databases]
omni_service_auth = host=omni-services-auth port=5433 dbname=omni_service_auth
omni_service_user = host=omni-services-user port=5439 dbname=omni_service_user
omni_service_post = host=omni-services-post port=5441 dbname=omni_service_post
omni_service_notification = host=omni-services-notification port=5436 dbname=omni_service_notification
omni_service_media = host=omni-services-media port=5442 dbname=omni_service_media
omni_service_commerce = host=omni-services-commerce port=5443 dbname=omni_service_commerce
omni_service_supplier = host=omni-services-supplier port=5444 dbname=omni_service_supplier
omni_service_order = host=omni-services-order port=5445 dbname=omni_service_order
omni_service_payment = host=omni-services-payment port=5446 dbname=omni_service_payment
omni_service_product = host=omni-services-product port=5447 dbname=omni_service_product

[pgbouncer]
logfile = /tmp/pgbouncer.log
pidfile = /tmp/pgbouncer.pid
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

; Connection Pool Settings (Transaction Mode)
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 50

; User permissions
admin_users = postgres,zeion
stats_users = postgres,zeion

; Compatibility and Query Parameter handling
ignore_startup_parameters = extra_float_digits
server_reset_query = DISCARD ALL
server_check_query = select 1
server_check_delay = 30

; Connection Timeouts and Limits
server_idle_timeout = 600
client_idle_timeout = 0
query_timeout = 0

; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 0
