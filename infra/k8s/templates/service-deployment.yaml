apiVersion: apps/v1
kind: Deployment
metadata:
   name: omni-{{SERVICE_NAME}}
   namespace: { { NAMESPACE } }
   labels:
      app.kubernetes.io/name: omni-{{SERVICE_NAME}}
      app.kubernetes.io/part-of: omni-services
      app.kubernetes.io/component: microservice
spec:
   replicas: 2
   strategy:
      type: RollingUpdate
      rollingUpdate:
         maxSurge: 1
         maxUnavailable: 0
   selector:
      matchLabels:
         app.kubernetes.io/name: omni-{{SERVICE_NAME}}
   template:
      metadata:
         labels:
            app.kubernetes.io/name: omni-{{SERVICE_NAME}}
            app.kubernetes.io/part-of: omni-services
      spec:
         terminationGracePeriodSeconds: 30
         containers:
            - name: { { SERVICE_NAME } }
              image: { { IMAGE_TAG } }
              imagePullPolicy: IfNotPresent
              envFrom:
                 - configMapRef:
                      name: omni-services-config
                      optional: true
                 - secretRef:
                      name: omni-services-secret
                      optional: true
              env:
                 - name: SERVICE_NAME
                   value: '{{SERVICE_NAME}}'
                 - name: NODE_ENV
                   value: 'production'
              ports:
                 - name: http
                   containerPort: 3000
                   protocol: TCP
                 - name: grpc
                   containerPort: 50051
                   protocol: TCP
              resources:
                 requests:
                    cpu: 100m
                    memory: 256Mi
                 limits:
                    cpu: 1000m
                    memory: 1024Mi
              readinessProbe:
                 tcpSocket:
                    port: 3000
                 initialDelaySeconds: 10
                 periodSeconds: 5
                 timeoutSeconds: 3
                 failureThreshold: 3
              livenessProbe:
                 tcpSocket:
                    port: 3000
                 initialDelaySeconds: 20
                 periodSeconds: 15
                 timeoutSeconds: 5
                 failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
   name: omni-{{SERVICE_NAME}}
   namespace: { { NAMESPACE } }
   labels:
      app.kubernetes.io/name: omni-{{SERVICE_NAME}}
      app.kubernetes.io/part-of: omni-services
spec:
   type: ClusterIP
   selector:
      app.kubernetes.io/name: omni-{{SERVICE_NAME}}
   ports:
      - name: http
        port: 3000
        targetPort: 3000
        protocol: TCP
      - name: grpc
        port: 50051
        targetPort: 50051
        protocol: TCP
