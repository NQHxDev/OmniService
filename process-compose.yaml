version: '0.5'

processes:
   # Core Shared Infrastructure (Redis, RabbitMQ, Jaeger, PgBouncer)
   infra:
      command: docker compose --profile infra up -d --wait && exec docker compose logs -f redis rabbitmq jaeger pgbouncer
      shutdown:
         command: docker compose --profile infra stop

   # Core Services
   gateway:
      command: exec pnpm run start:nowatch:gateway
      availability:
         restart: on_failure
      depends_on:
         infra:
            condition: process_started

   # Business Services
   auth:
      command: docker compose --profile auth up -d --wait && pnpm --filter @omni/auth run prisma:push && pnpm --filter @omni/auth run prisma:seed && exec pnpm run start:nowatch:auth
      availability:
         restart: on_failure
      depends_on:
         infra:
            condition: process_started
      disabled: true

   user:
