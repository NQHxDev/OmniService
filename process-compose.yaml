version: '0.5'

processes:
   # Core Shared Infrastructure (Redis, RabbitMQ, Jaeger, PgBouncer)
   infra:
      command: docker compose --profile infra up -d --wait && exec docker compose logs -f redis rabbitmq jaeger pgbouncer
      readiness_probe:
         exec:
            command: nc -z localhost 6379 && nc -z localhost 5672 && nc -z localhost 6432
         initial_delay_seconds: 2
         period_seconds: 1
         timeout_seconds: 5
         success_threshold: 1
         failure_threshold: 30
      shutdown:
         command: docker compose --profile infra stop

   # Core Services
   gateway:
      command: exec pnpm run start:nowatch:gateway
      availability:
         restart: on_failure
      depends_on:
         infra:
            condition: process_healthy

   # Business Services
   auth:
      command: ./scripts/run-service.sh auth "docker compose --profile auth up -d --wait && pnpm --filter @omni/auth run prisma:push && pnpm --filter @omni/auth run prisma:seed && pnpm run start:nowatch:auth"
      availability:
         restart: on_failure
      depends_on:
         infra:
            condition: process_healthy
      disabled: true

   user:
      command: ./scripts/run-service.sh user "docker compose --profile user up -d --wait && pnpm --filter @omni/user run prisma:push && pnpm run start:nowatch:user"
