version: '0.5'

processes:
   # Core Shared Infrastructure (Redis, RabbitMQ, Jaeger, PgBouncer)
   infra:
      command: docker compose up -d --wait redis rabbitmq jaeger pgbouncer && exec docker compose logs -f redis rabbitmq jaeger pgbouncer
      shutdown:
         command: docker compose stop redis rabbitmq jaeger pgbouncer

   # Core Services
   gateway:
      command: exec pnpm run start:nowatch:gateway
      availability:
         restart: on_failure
      depends_on:
         infra:
            condition: process_started

   # Business Services
   auth:
      command: docker compose --profile auth up -d --wait && pnpm --filter @omni/auth run prisma:push && pnpm --filter @omni/auth run prisma:seed && exec pnpm run start:nowatch:auth
      shutdown:
         command: docker compose --profile auth stop
      availability:
         restart: on_failure
      depends_on:
         infra:
            condition: process_started
      disabled: true

   user:
      command: docker compose --profile user up -d --wait && pnpm --filter @omni/user run prisma:push && exec pnpm run start:nowatch:user
