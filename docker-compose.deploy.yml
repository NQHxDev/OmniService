# ==============================================================================
# OmniServices — Full Production Deploy (Docker Compose)
# Includes: All microservices + Infra + Cloudflare Tunnel
#
# Usage:
#   docker compose -f docker-compose.deploy.yml --env-file .env.deploy up -d
#   docker compose -f docker-compose.deploy.yml --env-file .env.deploy down
# ==============================================================================

name: omni-deploy

# ──────────────────────────────────────────────────────────────────────────────
# SHARED DEFAULTS
# ──────────────────────────────────────────────────────────────────────────────
x-service-defaults: &service-defaults
   restart: unless-stopped
   networks:
      - omni-network

x-pg-healthcheck: &pg-healthcheck
   interval: 10s
   timeout: 5s
   retries: 5
   start_period: 15s

# ──────────────────────────────────────────────────────────────────────────────
# SERVICES
# ──────────────────────────────────────────────────────────────────────────────
services:
   # ============================================================================
   # INFRASTRUCTURE LAYER
   # ============================================================================

   redis:
      image: redis/redis-stack-server:latest
      container_name: omni-deploy-redis
      restart: unless-stopped
      ports:
         - '6379:6379'
      volumes:
         - redis_data:/data
      healthcheck:
         test: ['CMD', 'redis-cli', 'ping']
         interval: 10s
         timeout: 5s
         retries: 5
         start_period: 10s
      networks:
         - omni-network

   rabbitmq:
      image: rabbitmq:4-management-alpine
      container_name: omni-deploy-rabbitmq
      restart: unless-stopped
      environment:
         RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
         RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      ports:
         - '5672:5672'
         - '15672:15672'
      volumes:
         - rabbitmq_data:/var/lib/rabbitmq
         - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      healthcheck:
         test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
         interval: 15s
         timeout: 25s
         retries: 5
         start_period: 30s
      networks:
         - omni-network

   jaeger:
      image: jaegertracing/jaeger:latest
      container_name: omni-deploy-jaeger
      restart: unless-stopped
      ports:
         - '16686:16686'
         - '4318:4318'
         - '4317:4317'
      networks:
         - omni-network

   elasticsearch:
      image: elasticsearch:8.17.0
      container_name: omni-deploy-elasticsearch
      restart: unless-stopped
      environment:
         - discovery.type=single-node
         - xpack.security.enabled=false
         - xpack.security.http.ssl.enabled=false
         - ES_JAVA_OPTS=-Xms512m -Xmx512m
      ulimits:
         memlock:
            soft: -1
            hard: -1
         nofile:
            soft: 65536
            hard: 65536
      ports:
         - '9200:9200'
      volumes:
         - elasticsearch_data:/usr/share/elasticsearch/data
      healthcheck:
         test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health | grep -vq "\"status\":\"red\""']
         interval: 10s
         timeout: 10s
         retries: 15
         start_period: 30s
      networks:
         - omni-network

   # ── NebulaGraph (social graph cho User service) ────────────────────────────
   # FIX: Tăng start_period & retries — storaged cần 60-90s để init
   nebula-metad:
      image: vesoft/nebula-metad:v3.8.0
      container_name: omni-deploy-nebula-metad
      restart: unless-stopped
      environment:
         USER: root
      command:
         - --meta_server_addrs=nebula-metad:9559
         - --local_ip=nebula-metad
         - --ws_ip=0.0.0.0
         - --port=9559
         - --ws_http_port=19559
         - --data_path=/data/meta
         - --log_dir=/logs
         - --v=0
         - --minloglevel=0
      volumes:
         - nebula_metad_data:/data/meta
         - nebula_metad_logs:/logs
      healthcheck:
         test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:19559/status']
         interval: 10s
         timeout: 10s
         retries: 15
         start_period: 30s
      networks:
         - omni-network

   nebula-storaged:
      image: vesoft/nebula-storaged:v3.8.0
      container_name: omni-deploy-nebula-storaged
      restart: unless-stopped
      environment:
         USER: root
      command:
         - --meta_server_addrs=nebula-metad:9559
         - --local_ip=nebula-storaged
         - --ws_ip=0.0.0.0
         - --port=9779
         - --ws_http_port=19779
         - --data_path=/data/storage
         - --log_dir=/logs
         - --v=0
         - --minloglevel=0
      depends_on:
         nebula-metad:
            condition: service_healthy
      volumes:
         - nebula_storaged_data:/data/storage
         - nebula_storaged_logs:/logs
      healthcheck:
         # FIX: start_period=90s + retries=30 để đủ thời gian init
         test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:19779/status']
         interval: 10s
         timeout: 10s
         retries: 30
         start_period: 90s
      networks:
         - omni-network

   nebula-graphd:
      image: vesoft/nebula-graphd:v3.8.0
      container_name: omni-deploy-nebula-graphd
      restart: unless-stopped
      environment:
         USER: root
      command:
         - --meta_server_addrs=nebula-metad:9559
         - --local_ip=nebula-graphd
         - --ws_ip=0.0.0.0
         - --port=9669
         - --ws_http_port=19669
         - --log_dir=/logs
         - --v=0
         - --minloglevel=0
         - --max_sessions_per_ip_per_user=100000
      depends_on:
         nebula-metad:
            condition: service_healthy
      volumes:
         - nebula_graphd_logs:/logs
      healthcheck:
         test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:19669/status']
         interval: 10s
         timeout: 10s
         retries: 20
         start_period: 30s
      networks:
         - omni-network

   # ============================================================================
   # DATABASE LAYER (Postgres per service)
   # ============================================================================

   auth-postgres:
      image: postgres:17-alpine
      container_name: omni-deploy-auth-postgres
      command:
         [
            'postgres',
            '-p',
            '5433',
            '-c',
            'wal_level=logical',
            '-c',
            'max_wal_senders=10',
            '-c',
            'max_replication_slots=10',
         ]
      restart: unless-stopped
      environment:
         POSTGRES_USER: ${POSTGRES_USER:-zeion}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-582005}
         POSTGRES_DB: omni_service_auth
         PGPORT: 5433
      ports:
         - '5433:5433'
      volumes:
         - auth_postgres_data:/var/lib/postgresql/data
      healthcheck:
         test: ['CMD-SHELL', 'pg_isready -p 5433 -U ${POSTGRES_USER:-zeion} -d omni_service_auth']
         <<: *pg-healthcheck
      networks:
         - omni-network

   user-postgres:
      image: postgres:17-alpine
      container_name: omni-deploy-user-postgres
      command:
         [
            'postgres',
            '-p',
            '5439',
            '-c',
            'wal_level=logical',
            '-c',
            'max_wal_senders=10',
            '-c',
            'max_replication_slots=10',
         ]
      restart: unless-stopped
      environment:
         POSTGRES_USER: ${POSTGRES_USER:-zeion}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-582005}
         POSTGRES_DB: omni_service_user
