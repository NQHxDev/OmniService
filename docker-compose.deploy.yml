         test: ['CMD-SHELL', 'pg_isready -p 5448 -U ${POSTGRES_USER:-postgres} -d omni_service_analyze']
         <<: *pg-healthcheck
      networks:
         - omni-network

   # ── PgBouncer — dùng config deploy riêng (host = service name nội bộ) ─────
   pgbouncer:
      image: edoburu/pgbouncer:latest
      container_name: omni-deploy-pgbouncer
      restart: unless-stopped
      ports:
         - '6432:6432'
      volumes:
         # FIX: dùng pgbouncer.deploy.ini thay vì pgbouncer.ini (host đúng với docker service name)
         - ./infra/pgbouncer/pgbouncer.deploy.ini:/etc/pgbouncer/pgbouncer.ini:ro
         - ./infra/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
      healthcheck:
         test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-p', '6432']
         interval: 10s
         timeout: 5s
         retries: 5
         start_period: 15s
      depends_on:
         auth-postgres:
            condition: service_healthy
         user-postgres:
            condition: service_healthy
         notification-postgres:
            condition: service_healthy
         post-postgres:
            condition: service_healthy
         media-postgres:
            condition: service_healthy
         commerce-postgres:
            condition: service_healthy
         supplier-postgres:
            condition: service_healthy
         order-postgres:
            condition: service_healthy
         payment-postgres:
            condition: service_healthy
         product-postgres:
            condition: service_healthy
         analyze-postgres:
            condition: service_healthy
      networks:
         - omni-network

   # ============================================================================
   # MICROSERVICES LAYER
   # ============================================================================

   gateway:
      command: ['sh', '-c', 'exec node dist/apps/gateway/main.js']
      build:
         context: .
         dockerfile: Dockerfile
         args:
            SERVICE_NAME: gateway
      image: omni-gateway:latest
      container_name: omni-deploy-gateway
      restart: unless-stopped
      env_file:
         - apps/gateway/.env
      environment:
         NODE_ENV: production
         JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
         PORT: 8080
         # Override localhost → Docker service names (gRPC)
         AUTH_GRPC_URL: auth:50051
         USER_GRPC_URL: user:50052
         MEDIA_GRPC_URL: media:50055
         POST_GRPC_URL: post:50059
         SEARCH_GRPC_URL: search:50056
         CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,https://service.zeion.online,https://zeion.online}
         COMMERCE_GRPC_URL: commerce:50053
         SUPPLIER_GRPC_URL: supplier:50054
         ORDER_GRPC_URL: order:50057
         PAYMENT_GRPC_URL: payment:50058
         PRODUCT_GRPC_URL: product:50060
         ANALYZE_GRPC_URL: analyze:50061
         NOTIFICATION_GRPC_URL: notification:50062
         REDIS_HOST: redis
         REDIS_PORT: 6379
         OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      ports:
         - '8080:8080'
      volumes:
         - ./apps/gateway/keys:/app/apps/gateway/keys:ro
      depends_on:
         redis:
            condition: service_healthy
         rabbitmq:
            condition: service_healthy
         auth:
            condition: service_started
         user:
            condition: service_started
      healthcheck:
         test: ['CMD', 'curl', '-sf', 'http://localhost:8080/api/v1/health']
         interval: 15s
         timeout: 5s
         retries: 10
         start_period: 30s
      networks:
         - omni-network

   web:
      build:
         context: ./temp
         dockerfile: Dockerfile
         args:
            NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      image: omni-web:latest
      container_name: omni-deploy-web
      restart: unless-stopped
      environment:
         NODE_ENV: production
         PORT: 3000
         NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      ports:
         - '3000:3000'
      depends_on:
         gateway:
            condition: service_started
      healthcheck:
         test: ['CMD', 'curl', '-sf', 'http://localhost:3000/']
         interval: 15s
         timeout: 5s
         retries: 5
         start_period: 15s
      networks:
         - omni-network

   auth:
      command: ['sh', '-c', 'exec node dist/apps/auth/main.js']
      build:
         context: .
         dockerfile: Dockerfile
         args:
            SERVICE_NAME: auth
      image: omni-auth:latest
      container_name: omni-deploy-auth
      restart: unless-stopped
      env_file:
         - apps/auth/.env
      environment:
         NODE_ENV: production
         JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
         DATABASE_URL: postgresql://${POSTGRES_USER:-zeion}:${POSTGRES_PASSWORD:-582005}@pgbouncer:6432/omni_service_auth?connection_limit=5&pool_timeout=10&pgbouncer=true
         DIRECT_URL: postgresql://${POSTGRES_USER:-zeion}:${POSTGRES_PASSWORD:-582005}@auth-postgres:5433/omni_service_auth
         RABBIT_MQ_URI: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
         REDIS_HOST: redis
         REDIS_PORT: 6379
         OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      volumes:
         - ./apps/auth/keys:/app/apps/auth/keys:ro
      depends_on:
         pgbouncer:
            condition: service_healthy
         rabbitmq:
            condition: service_healthy
      networks:
         - omni-network

