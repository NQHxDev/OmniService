         <<: *pg-healthcheck
      networks:
         - omni-network

   notification-postgres:
      image: postgres:17-alpine
      container_name: omni-deploy-notification-postgres
      command: ['postgres', '-p', '5436']
      restart: unless-stopped
      environment:
         POSTGRES_USER: ${POSTGRES_USER:-zeion}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-582005}
         POSTGRES_DB: omni_service_notification
