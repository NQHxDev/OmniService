      restart: unless-stopped
      environment:
         POSTGRES_USER: ${POSTGRES_USER:-zeion}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-582005}
         POSTGRES_DB: omni_service_post
         PGPORT: 5441
      ports:
