         RABBIT_MQ_URI: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
         REDIS_HOST: redis
         REDIS_PORT: 6379
         OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      depends_on:
         pgbouncer:
            condition: service_healthy
         redis:
            condition: service_healthy
         rabbitmq:
            condition: service_healthy
      networks:
         - omni-network

   search:
      command: ['sh', '-c', 'exec node dist/apps/search/main.js']
      build:
         context: .
         dockerfile: Dockerfile
         args:
