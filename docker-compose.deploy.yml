         DIRECT_URL: postgresql://${POSTGRES_USER:-zeion}:${POSTGRES_PASSWORD:-582005}@user-postgres:5439/omni_service_user
         RABBIT_MQ_URI: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
         NEBULA_GRAPHD_HOST: nebula-graphd
         NEBULA_GRAPHD_PORT: 9669
         OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      depends_on:
