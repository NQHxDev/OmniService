syntax = "proto3";

package post.v1;

message PostIngredientProto {
  string ingredientId = 1;
  string name = 2;
  optional double amount = 3;
  optional string unit = 4;
  optional string group = 5;
  int32 sortOrder = 6;
  optional string catalogIngredientId = 7;
}

message RecipeStepProto {
  string stepId = 1;
  int32 stepNumber = 2;
  optional string title = 3;
  string instruction = 4;
  optional int32 timestampSeconds = 5;
  optional string imageUrl = 6;
  optional string mediaId = 7;
}

message RecipeProto {
  string recipeId = 1;
  int32 prepTimeMinutes = 2;
  int32 cookTimeMinutes = 3;
  int32 servings = 4;
  string difficulty = 5;
  optional int32 calories = 6;
  optional string cuisine = 7;
  optional string chefTips = 8;
  repeated RecipeStepProto steps = 9;
}

message PostItemProto {
  string postId = 1;
  string userId = 2;
  string title = 3;
  optional string caption = 4;
  optional string mediaId = 5;
  string videoUrl = 6;
  optional string playbackUrl = 7;
  string thumbnailUrl = 8;
  optional string blurHash = 9;
  int32 duration = 10;
  optional int32 videoWidth = 11;
  optional int32 videoHeight = 12;
  int32 viewCount = 13;
  int32 likeCount = 14;
  int32 commentCount = 15;
  int32 shareCount = 16;
  int32 saveCount = 17;
  bool allowComments = 18;
  bool allowDuet = 19;
  string createdAt = 20;
  string updatedAt = 21;
  repeated PostIngredientProto ingredients = 22;
  optional RecipeProto recipe = 23;
  repeated string tags = 24;
  repeated string mentionedUserIds = 25;
}
