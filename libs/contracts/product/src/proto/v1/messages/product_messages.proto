syntax = "proto3";

package product.v1;

import "models/product.proto";

message GetProductByIdRequest {
  string productId = 1;
}

message GetProductByIdResponse {
  ProductProto product = 1;
}

message GetProductsByIdsRequest {
  repeated string productIds = 1;
}

message GetProductsByIdsResponse {
  repeated ProductProto products = 1;
}

message ListProductsRequest {
  string supplierId = 1;
  string whoCategoryCode = 2;
  string status = 3;
  string moderationStatus = 4;
  string search = 5;
  int32 limit = 6;
  int32 offset = 7;
}

message ListProductsResponse {
  repeated ProductProto items = 1;
  int32 total = 2;
}

message CreateVariantInputProto {
  string sku = 1;
  string variantName = 2;
  string unit = 3;
  string packSize = 4;
  double price = 5;
  double originalPrice = 6;
  string currency = 7;
  int32 stockQuantity = 8;
  int32 lowStockThreshold = 9;
  bool isDefault = 10;
}

message CreateProductRequest {
  string supplierId = 1;
  string whoCategoryCode = 2;
  string productName = 3;
  string description = 4;
  string origin = 5;
  string storageCondition = 6;
  int32 shelfLifeDays = 7;
  repeated string images = 8;
  repeated CreateVariantInputProto variants = 9;
}

message CreateProductResponse {
  ProductProto product = 1;
}

message UpdateProductRequest {
  string productId = 1;
  string supplierId = 2;
  string productName = 3;
  string description = 4;
  string origin = 5;
  string storageCondition = 6;
  int32 shelfLifeDays = 7;
  repeated string images = 8;
}

message UpdateProductResponse {
  ProductProto product = 1;
}

message ModerateProductRequest {
  string productId = 1;
  string moderationStatus = 2;
  string rejectionReason = 3;
  string moderatedBy = 4;
  string action = 5;
  string moderationNotes = 6;
  string moderatorEmail = 7;
}

message ModerateProductResponse {
  ProductProto product = 1;
}

message SubmitProductForReviewRequest {
  string productId = 1;
  string supplierId = 2;
}

message SubmitProductForReviewResponse {
  ProductProto product = 1;
}

message GetProductModerationHistoryRequest {
  string productId = 1;
}

message GetProductModerationHistoryResponse {
  repeated ProductModerationHistoryProto items = 1;
}

message UpdateProductStatusRequest {
  string productId = 1;
  string supplierId = 2;
  string status = 3;
}

message UpdateProductStatusResponse {
  ProductProto product = 1;
}

message StockItemRequest {
  string variantId = 1;
  int32 quantity = 2;
}

message CheckAndReserveStockRequest {
  string orderId = 1;
  repeated StockItemRequest items = 2;
}

message ReservedItemResult {
  string variantId = 1;
  string sku = 2;
  bool success = 3;
  int32 availableStock = 4;
  string message = 5;
}

message CheckAndReserveStockResponse {
  bool allReserved = 1;
  repeated ReservedItemResult results = 2;
}

message ReleaseStockRequest {
  string orderId = 1;
  repeated StockItemRequest items = 2;
}

message ReleaseStockResponse {
  bool success = 1;
}

message AdjustStockRequest {
  string variantId = 1;
  string supplierId = 2;
  int32 quantityDelta = 3;
  string movementType = 4;
  string reason = 5;
}

message AdjustStockResponse {
  ProductVariantProto variant = 1;
}

message ListWhoCategoriesRequest {}

message ListWhoCategoriesResponse {
  repeated WhoCategoryProto categories = 1;
}

