syntax = "proto3";

package product.v1;

import "models/product.proto";

message GetProductByIdRequest {
  string product_id = 1;
}

message GetProductByIdResponse {
  ProductProto product = 1;
}

message GetProductsByIdsRequest {
  repeated string product_ids = 1;
}

message GetProductsByIdsResponse {
  repeated ProductProto products = 1;
}

message ListProductsRequest {
  string supplier_id = 1;
  string who_category_code = 2;
  string status = 3;
  string moderation_status = 4;
  string search = 5;
  int32 limit = 6;
  int32 offset = 7;
}

message ListProductsResponse {
  repeated ProductProto items = 1;
  int32 total = 2;
}

message CreateVariantInputProto {
  string sku = 1;
  string variant_name = 2;
  string unit = 3;
  string pack_size = 4;
  double price = 5;
  double original_price = 6;
  string currency = 7;
  int32 stock_quantity = 8;
  int32 low_stock_threshold = 9;
  bool is_default = 10;
}

message CreateProductRequest {
  string supplier_id = 1;
  string who_category_code = 2;
  string product_name = 3;
  string description = 4;
  string origin = 5;
  string storage_condition = 6;
  int32 shelf_life_days = 7;
  repeated string images = 8;
  repeated CreateVariantInputProto variants = 9;
}

message CreateProductResponse {
  ProductProto product = 1;
}

message UpdateProductRequest {
  string product_id = 1;
  string supplier_id = 2;
  string product_name = 3;
  string description = 4;
  string origin = 5;
  string storage_condition = 6;
  int32 shelf_life_days = 7;
  repeated string images = 8;
}

message UpdateProductResponse {
  ProductProto product = 1;
}

message ModerateProductRequest {
  string product_id = 1;
  string moderation_status = 2;
  string rejection_reason = 3;
  string moderated_by = 4;
}

message ModerateProductResponse {
  ProductProto product = 1;
}

message UpdateProductStatusRequest {
  string product_id = 1;
  string supplier_id = 2;
  string status = 3;
}

message UpdateProductStatusResponse {
  ProductProto product = 1;
}

message StockItemRequest {
  string variant_id = 1;
  int32 quantity = 2;
}

message CheckAndReserveStockRequest {
  string order_id = 1;
  repeated StockItemRequest items = 2;
}

message ReservedItemResult {
  string variant_id = 1;
  string sku = 2;
  bool success = 3;
  int32 available_stock = 4;
  string message = 5;
}

message CheckAndReserveStockResponse {
  bool all_reserved = 1;
  repeated ReservedItemResult results = 2;
}

message ReleaseStockRequest {
  string order_id = 1;
  repeated StockItemRequest items = 2;
}

message ReleaseStockResponse {
  bool success = 1;
}

message AdjustStockRequest {
  string variant_id = 1;
  string supplier_id = 2;
  int32 quantity_delta = 3;
  string movement_type = 4;
  string reason = 5;
}

message AdjustStockResponse {
  ProductVariantProto variant = 1;
}

message ListWhoCategoriesRequest {}

message ListWhoCategoriesResponse {
  repeated WhoCategoryProto categories = 1;
}
