syntax = "proto3";

package product.v1;

message ProductVariantProto {
  string variantId = 1;
  string productId = 2;
  string sku = 3;
  string variantName = 4;
  string unit = 5;
  string packSize = 6;
  double price = 7;
  double originalPrice = 8;
  string currency = 9;
  int32 stockQuantity = 10;
  int32 reservedQuantity = 11;
  int32 lowStockThreshold = 12;
  bool isDefault = 13;
  string status = 14;
}

message ProductProto {
  string productId = 1;
  string supplierId = 2;
  string whoCategoryCode = 3;
  string productName = 4;
  string productSlug = 5;
  string description = 6;
  string origin = 7;
  string storageCondition = 8;
  int32 shelfLifeDays = 9;
  repeated string images = 10;
  string status = 11;
  string moderationStatus = 12;
  string rejectionReason = 13;
  repeated ProductVariantProto variants = 14;
  int32 version = 15;
  string createdAt = 16;
  string updatedAt = 17;
  string pendingEditData = 18;
}

message ProductModerationHistoryProto {
  string historyId = 1;
  string productId = 2;
  string moderatorId = 3;
  string moderatorEmail = 4;
  string action = 5;
  string previousStatus = 6;
  string newStatus = 7;
  string rejectionReason = 8;
  string moderationNotes = 9;
  string snapshot = 10;
  string createdAt = 11;
}

message WhoCategoryProto {
  string code = 1;
  string name = 2;
  string description = 3;
  string examples = 4;
  int32 order = 5;
}
