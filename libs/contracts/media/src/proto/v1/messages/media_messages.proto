syntax = "proto3";

package media.v1;

import "models/media.proto";

message GetUploadUrlRequest {
  string fileName = 1;
  string mimeType = 2;
  optional int64 size = 3;
  optional string type = 4;
  optional string folder = 5;
  optional string provider = 6;
}

message GetUploadUrlResponse {
  string mediaId = 1;
  string provider = 2;
  string method = 3;
  optional string uploadUrl = 4;
  optional string publicUrl = 5;
  optional string key = 6;
  optional string signature = 7;
  optional int64 timestamp = 8;
  optional string apiKey = 9;
  optional string cloudName = 10;
  map<string, string> headers = 11;
}

message UploadFileRequest {
  string fileBase64 = 1;
  optional string fileName = 2;
  optional string mimeType = 3;
  optional string type = 4;
  optional string folder = 5;
  optional string provider = 6;
}

message UploadFileResponse {
  MediaProto media = 1;
}

message ConfirmUploadRequest {
  string mediaId = 1;
  optional int64 size = 2;
  optional int32 width = 3;
  optional int32 height = 4;
  optional double duration = 5;
  optional string thumbnailUrl = 6;
}

message ConfirmUploadResponse {
  MediaProto media = 1;
}

message GetMediaByIdRequest {
  string id = 1;
}

message GetMediaByIdResponse {
  MediaProto media = 1;
}

message DeleteMediaRequest {
  string id = 1;
}

message DeleteMediaResponse {
  bool success = 1;
}

message MultipartPartUrlProto {
  int32 partNumber = 1;
  string uploadUrl = 2;
}

message CompletedPartProto {
  int32 partNumber = 1;
  string etag = 2;
}

message InitiateMultipartUploadRequest {
  string fileName = 1;
  string mimeType = 2;
  int32 partsCount = 3;
  optional int64 fileSize = 4;
  optional string folder = 5;
}

message InitiateMultipartUploadResponse {
  string mediaId = 1;
  string uploadId = 2;
  string key = 3;
  string publicUrl = 4;
  repeated MultipartPartUrlProto parts = 5;
}

message CompleteMultipartUploadRequest {
  string mediaId = 1;
  string uploadId = 2;
  repeated CompletedPartProto parts = 3;
}

message CompleteMultipartUploadResponse {
  MediaProto media = 1;
}
