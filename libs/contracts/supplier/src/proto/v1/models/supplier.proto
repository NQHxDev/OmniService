syntax = "proto3";

package supplier.v1;

message SupplierProto {
  string supplierId = 1;
  string supplierName = 2;
  string supplierSlug = 3;
  string supplierCode = 4;
  string contactEmail = 5;
  string contactPhone = 6;
  string address = 7;
  string city = 8;
  double rating = 9;
  bool isVerified = 10;
  string supplierStatus = 11;
  string supplierLogoUrl = 12;
  int32 version = 13;
  string createdAt = 14;
  string updatedAt = 15;
  optional string merchantType = 16;
  optional string citizenId = 17;
  optional string citizenIdIssuedDate = 18;
  optional string idCardFrontUrl = 19;
  optional string idCardBackUrl = 20;
  optional string businessName = 21;
  optional string taxCode = 22;
  optional string businessLicenseUrl = 23;
  optional string bankName = 24;
  optional string bankAccountNumber = 25;
  optional string bankAccountHolder = 26;
  optional string rejectionReason = 27;
  optional string verifiedAt = 28;
}
