name: OmniServices CI Pipeline

on:
   push:
      branches:
         - main
         - staging
   pull_request:
      branches:
         - main
         - staging

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

env:
   DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/omni_ci?schema=public'

jobs:
   code-quality:
      name: Code Style & Lint
      runs-on: ubuntu-latest
      steps:
         - name: Checkout Code
           uses: actions/checkout@v7

         - name: Setup Environment & Dependencies
           uses: ./.github/actions/setup-pnpm-env

         - name: Check Code Formatting
           run: pnpm exec prettier --check "{src,apps,libs,test}/**/*.ts"

         - name: Run ESLint
           run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

   typecheck:
      name: TypeScript Type Check
      runs-on: ubuntu-latest
      steps:
         - name: Checkout Code
           uses: actions/checkout@v7

         - name: Setup Environment & Dependencies
           uses: ./.github/actions/setup-pnpm-env

         - name: Run TypeScript Type Check
           run: pnpm run typecheck

   security-scan:
      name: Security & Vulnerability Scan
      runs-on: ubuntu-latest
      steps:
         - name: Checkout Code
           uses: actions/checkout@v7

         - name: Setup Environment & Dependencies
           uses: ./.github/actions/setup-pnpm-env
           with:
              prisma-generate: 'false'

         - name: Run PNPM Audit
           run: pnpm audit --audit-level=high
           continue-on-error: true

         - name: TruffleHog Secrets Scan
           uses: trufflesecurity/trufflehog@main
           continue-on-error: true
           with:
              path: ./
              base: ${{ github.event.repository.default_branch || 'main' }}
              head: HEAD

   unit-tests:
      name: Run Unit Tests [Shard ${{ matrix.shard }}/4]
      runs-on: ubuntu-latest
      strategy:
         fail-fast: false
         matrix:
            shard: [1, 2, 3, 4]
      steps:
         - name: Checkout Code
           uses: actions/checkout@v7

         - name: Setup Environment & Dependencies
           uses: ./.github/actions/setup-pnpm-env

         - name: Execute Tests with Coverage
           run: |
              pnpm exec jest \
                --passWithNoTests \
                --shard=${{ matrix.shard }}/4 \
                --maxWorkers=2 \
                --ci \
                --coverage \
                --coverageReporters=json \
                --coverageReporters=lcov \
                --coverageReporters=text-summary

         - name: Upload Coverage Shard Artifact
           uses: actions/upload-artifact@v4
           with:
              name: coverage-shard-${{ matrix.shard }}
              path: coverage/
              retention-days: 1

   coverage-report:
      name: Merge & Report Coverage
      runs-on: ubuntu-latest
      needs: [unit-tests]
      steps:
         - name: Checkout Code
           uses: actions/checkout@v4

         - name: Setup Environment & Dependencies
           uses: ./.github/actions/setup-pnpm-env
           with:
              prisma-generate: 'false'

         - name: Download All Coverage Artifacts
           uses: actions/download-artifact@v4
           with:
              pattern: coverage-shard-*
              path: coverage-shards/

         - name: Merge Coverage Reports
           run: |
              npx nyc merge coverage-shards coverage/merged.json || true
              npx nyc report --reporter=text-summary --reporter=lcov || true

   e2e-tests:
      name: Run E2E Integration Tests
      runs-on: ubuntu-latest
      needs: [code-quality, typecheck]
      services:
         postgres:
            image: postgres:17-alpine
            env:
               POSTGRES_USER: postgres
               POSTGRES_PASSWORD: postgres
               POSTGRES_DB: omni_ci
            ports:
               - 5432:5432
            options: >-
               --health-cmd pg_isready
               --health-interval 10s
               --health-timeout 5s
               --health-retries 5
         redis:
            image: redis:7-alpine
            ports:
               - 6379:6379
            options: >-
               --health-cmd "redis-cli ping"
               --health-interval 10s
               --health-timeout 5s
               --health-retries 5
         rabbitmq:
            image: rabbitmq:4-management-alpine
            env:
               RABBITMQ_DEFAULT_USER: admin
               RABBITMQ_DEFAULT_PASS: admin
            ports:
               - 5672:5672
               - 15672:15672
            options: >-
               --health-cmd "rabbitmq-diagnostics -q ping"
               --health-interval 10s
               --health-timeout 5s
               --health-retries 5
      env:
         DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/omni_ci?schema=public'
         REDIS_HOST: 'localhost'
         REDIS_PORT: 6379
         RABBIT_MQ_URI: 'amqp://admin:admin@localhost:5672'
         NODE_ENV: 'test'
      steps:
         - name: Checkout Code
           uses: actions/checkout@v4

         - name: Setup Environment & Dependencies
           uses: ./.github/actions/setup-pnpm-env

         - name: Push Database Schema
           run: pnpm --filter @omni/auth run prisma:push -- --accept-data-loss

         - name: Execute E2E Tests
           run: pnpm run test:e2e

   build-all:
      name: Build Services [Group ${{ matrix.group }}]
      runs-on: ubuntu-latest
      needs: [code-quality, typecheck]
      strategy:
         fail-fast: false
         matrix:
            include:
               - group: '1 (Core)'
                 services: 'gateway auth user notification'
               - group: '2 (Content & Media)'
                 services: 'post search media commerce'
               - group: '3 (Business & Order)'
                 services: 'supplier order payment product'
      steps:
         - name: Checkout Code
           uses: actions/checkout@v7

         - name: Setup Environment & Dependencies
           uses: ./.github/actions/setup-pnpm-env

         - name: Build Microservices
           run: sh scripts/build-sequential.sh "${{ matrix.services }}"

         - name: Upload Build Artifacts
           uses: actions/upload-artifact@v4
           with:
              name: dist-group-${{ matrix.group }}
              path: dist/
              retention-days: 7
