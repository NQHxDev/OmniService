name: OmniServices CI Pipeline

on:
   push:
      branches:
         - main
         - staging
   pull_request:
      branches:
         - main
         - staging

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

env:
   DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/omni_ci?schema=public'

jobs:
   lint-and-typecheck:
      name: Code Quality & Type Check
      runs-on: ubuntu-latest
      steps:
         - name: Checkout Code
           uses: actions/checkout@v7

         - name: Setup Environment & Dependencies
           uses: ./.github/actions/setup-pnpm-env

         - name: Check Code Formatting
           run: pnpm exec prettier --check "apps/**/*.ts" "libs/**/*.ts"

         - name: Run ESLint
           run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

         - name: Run TypeScript Type Check
           run: pnpm run typecheck

   unit-tests:
      name: Run Unit Tests [Shard ${{ matrix.shard }}/4]
      runs-on: ubuntu-latest
      strategy:
         fail-fast: false
         matrix:
            shard: [1, 2, 3, 4]
      steps:
         - name: Checkout Code
           uses: actions/checkout@v7

         - name: Setup Environment & Dependencies
           uses: ./.github/actions/setup-pnpm-env

         - name: Execute Tests
           run: pnpm exec jest --passWithNoTests --runInBand --shard=${{ matrix.shard }}/4

   build-all:
      name: Build All Microservices
      runs-on: ubuntu-latest
      needs: [lint-and-typecheck, unit-tests]
      steps:
         - name: Checkout Code
           uses: actions/checkout@v7

         - name: Setup Environment & Dependencies
           uses: ./.github/actions/setup-pnpm-env

         - name: Build All Services
           run: pnpm run build
