name: 'Setup PNPM & Node.js Environment'
description: 'Composite action to setup pnpm, Node.js with caching, install dependencies, and run Prisma generate'

inputs:
   node-version:
      description: 'Node.js version to setup'
      required: false
      default: '24'
   pnpm-version:
      description: 'pnpm version to setup'
      required: false
      default: '9'
   install-deps:
      description: 'Whether to install project dependencies'
      required: false
      default: 'true'
   frozen-lockfile:
      description: 'Whether to use --frozen-lockfile during pnpm install'
      required: false
      default: 'true'
   prisma-generate:
      description: 'Whether to run Prisma client generation'
      required: false
      default: 'true'

runs:
   using: 'composite'
   steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
           version: ${{ inputs.pnpm-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
           node-version: ${{ inputs.node-version }}
           cache: 'pnpm'

      - name: Install Dependencies
        if: inputs.install-deps == 'true'
        shell: bash
        run: |
           if [ "${{ inputs.frozen-lockfile }}" = "true" ]; then
             pnpm install --frozen-lockfile
           else
             pnpm install
           fi

      - name: Run Prisma Generate
        if: inputs.prisma-generate == 'true'
        shell: bash
        run: pnpm run prisma:generate
