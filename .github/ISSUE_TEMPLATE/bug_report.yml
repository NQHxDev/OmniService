name: '🐛 Bug Report'
description: 'Report an issue, defect, or unexpected behavior in OmniServices'
title: '[Bug]: '
labels: ['bug', 'triage']
body:
   - type: markdown
     attributes:
        value: |
           Thank you for reporting a bug! Please fill out the sections below with as much detail as possible to help us reproduce and resolve the issue quickly.

   - type: dropdown
     id: service
     attributes:
        label: Affected Service / Module
        description: Which microservice(s) or shared library is experiencing the issue?
        multiple: true
        options:
           - API Gateway (apps/gateway)
           - Auth Service (apps/auth)
           - User Service (apps/user)
           - Notification Service (apps/notification)
           - Post Service (apps/post)
           - Search Service (apps/search)
           - Media Service (apps/media)
           - Commerce Service (apps/commerce)
           - Supplier Service (apps/supplier)
           - Product Service (apps/product)
           - Order Service (apps/order)
           - Payment Service (apps/payment)
           - Common Library (libs/common)
           - Contracts / Proto (libs/contracts)
           - CI / CD / Infrastructure (.github, Docker, scripts)
           - Other
     validations:
        required: true

   - type: dropdown
     id: severity
     attributes:
        label: Severity / Priority
        description: How critical is this issue to the system?
        options:
           - Critical (P0) - Service down / Data corruption / Blocking all workflows
           - High (P1) - Major functionality broken with no workaround
           - Medium (P2) - Feature impaired but workaround available
           - Low (P3) - Minor glitch, typo, or cosmetic issue
     validations:
        required: true

   - type: textarea
     id: description
     attributes:
        label: Bug Description
        description: A clear and concise explanation of what the bug is.
        placeholder: Describe the problem clearly...
     validations:
        required: true

   - type: textarea
     id: reproduction
     attributes:
        label: Steps to Reproduce
        description: Detailed, step-by-step instructions to reproduce the problem.
        placeholder: |
           1. Start the services with 'pnpm pc:start' (or docker-compose)
           2. Send HTTP / gRPC request: POST /api/v1/... with payload {...}
           3. Observe the response / error: ...
     validations:
        required: true

   - type: textarea
     id: expected
     attributes:
        label: Expected vs Actual Behavior
        description: What did you expect to happen, and what actually occurred?
        placeholder: |
           Expected: Status 200 OK with valid response payload...
           Actual: Status 500 Internal Server Error with exception...
     validations:
        required: true

   - type: textarea
     id: logs
     attributes:
        label: Relevant Logs & Stack Traces
        description: Paste terminal output, NestJS / Docker logs, or attach error screenshots.
        render: shell
     validations:
        required: false

   - type: input
     id: environment
     attributes:
        label: Environment Details
        description: OS, Node.js version, pnpm version, branch / commit hash.
        placeholder: macOS 15.0 / Node v24.0.0 / pnpm v9.15.9 / branch staging
     validations:
        required: false

   - type: checkboxes
     id: checklist
     attributes:
        label: Pre-Submission Checklist
        options:
           - label: I have verified this is not a duplicate of an existing open issue.
             required: true
           - label: I have checked relevant service logs and error traces.
             required: true
           - label: I am using the latest code on the active branch (`main` or `staging`).
             required: false
