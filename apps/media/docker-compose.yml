name: omni-services

services:
   media-postgres:
      profiles:
         - media
      image: postgres:17-alpine
      container_name: omni-services-media
      command: ['postgres', '-p', '5442']
      restart: unless-stopped
      environment:
         POSTGRES_USER: ${POSTGRES_USER:-postgres}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
         POSTGRES_DB: ${POSTGRES_DB:-omni_service_media}
         PGPORT: ${POSTGRES_PORT:-5442}
      ports:
         - '${POSTGRES_PORT:-5442}:${POSTGRES_PORT:-5442}'
      volumes:
         - media_postgres_data:/var/lib/postgresql/data
      healthcheck:
         test:
            [
               'CMD-SHELL',
               'pg_isready -p ${POSTGRES_PORT:-5442} -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-omni_service_media}',
            ]
         interval: 10s
         timeout: 5s
         retries: 5
      networks:
         - omni-network

volumes:
   media_postgres_data:
      driver: local

networks:
   omni-network:
      driver: bridge
