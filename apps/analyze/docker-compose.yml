name: omni-services

services:
   analyze-postgres:
      profiles:
         - analyze
      image: postgres:17-alpine
      container_name: omni-services-analyze
      command: ['postgres', '-p', '5448']
      restart: unless-stopped
      environment:
         POSTGRES_USER: ${POSTGRES_USER:-postgres}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
         POSTGRES_DB: ${POSTGRES_DB:-omni_service_analyze}
         PGPORT: ${POSTGRES_PORT:-5448}
      ports:
         - '${POSTGRES_PORT:-5448}:${POSTGRES_PORT:-5448}'
      volumes:
         - analyze_postgres_data:/var/lib/postgresql/data
      healthcheck:
         test:
            [
               'CMD-SHELL',
               'pg_isready -p ${POSTGRES_PORT:-5448} -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-omni_service_analyze}',
            ]
         interval: 10s
         timeout: 5s
         retries: 5
      networks:
         - omni-network

volumes:
   analyze_postgres_data:
      driver: local

networks:
   omni-network:
      driver: bridge
