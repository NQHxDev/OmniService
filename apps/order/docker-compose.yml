name: omni-services

services:
   order-postgres:
      profiles:
         - order
      image: postgres:17-alpine
      container_name: omni-services-order
      command: ['postgres', '-p', '5445']
      restart: unless-stopped
      environment:
         POSTGRES_USER: ${POSTGRES_USER:-postgres}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
         POSTGRES_DB: ${POSTGRES_DB:-omni_service_order}
         PGPORT: ${POSTGRES_PORT:-5445}
      ports:
         - '${POSTGRES_PORT:-5445}:${POSTGRES_PORT:-5445}'
      volumes:
         - order_postgres_data:/var/lib/postgresql/data
      healthcheck:
         test:
            [
               'CMD-SHELL',
               'pg_isready -p ${POSTGRES_PORT:-5445} -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-omni_service_order}',
            ]
         interval: 10s
         timeout: 5s
         retries: 5
      networks:
         - omni-network

volumes:
   order_postgres_data:
      driver: local
