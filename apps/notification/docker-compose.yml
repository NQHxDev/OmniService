name: omni-services

services:
   notification-postgres:
      profiles:
         - notification
      image: postgres:17-alpine
      container_name: omni-services-notification
      command: ['postgres', '-p', '5436']
      restart: unless-stopped
      environment:
         POSTGRES_USER: ${POSTGRES_USER:-postgres}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
         POSTGRES_DB: ${POSTGRES_DB:-omni_service_notification}
         PGPORT: ${POSTGRES_PORT:-5436}
      ports:
         - '${POSTGRES_PORT:-5436}:${POSTGRES_PORT:-5436}'
      volumes:
         - notification_postgres_data:/var/lib/postgresql/data
      healthcheck:
         test:
            [
               'CMD-SHELL',
               'pg_isready -p ${POSTGRES_PORT:-5436} -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-omni_service_notification}',
            ]
         interval: 10s
         timeout: 5s
         retries: 5
      networks:
         - omni-network

volumes:
   notification_postgres_data:
      driver: local

networks:
   omni-network:
      driver: bridge
