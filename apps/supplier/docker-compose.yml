name: omni-services

services:
   supplier-postgres:
      profiles:
         - supplier
      image: postgres:17-alpine
      container_name: omni-services-supplier
      command:
         [
            'postgres',
            '-p',
            '5444',
            '-c',
            'wal_level=logical',
            '-c',
            'max_wal_senders=10',
            '-c',
            'max_replication_slots=10',
         ]
      restart: unless-stopped
      environment:
         POSTGRES_USER: ${POSTGRES_USER:-postgres}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
         POSTGRES_DB: ${POSTGRES_DB:-omni_service_supplier}
         PGPORT: ${POSTGRES_PORT:-5444}
      ports:
         - '${POSTGRES_PORT:-5444}:${POSTGRES_PORT:-5444}'
      volumes:
         - supplier_postgres_data:/var/lib/postgresql/data
      healthcheck:
         test:
            [
               'CMD-SHELL',
               'pg_isready -p ${POSTGRES_PORT:-5444} -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-omni_service_supplier}',
            ]
         interval: 10s
         timeout: 5s
         retries: 5
      networks:
         - omni-network

volumes:
   supplier_postgres_data:
      driver: local

networks:
   omni-network:
      driver: bridge
